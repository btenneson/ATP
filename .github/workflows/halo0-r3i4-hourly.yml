name: Halo(0) Formal Metamath — Operational (3,4) R3I4 — 50m Search

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/halo0-r3i4-hourly.yml
      - 'predator 8/predator 8.003-R3I4.py'
      - 'predator 8/predator 8.004-R3I4-indexed.py'
      - 'predator 8/predator_index_cache.py'
      - 'predator 8/predator_fast_parse.py'

permissions:
  contents: read

jobs:
  halo0-r3i4:
    runs-on: ubuntu-latest
    # Preprocessing is outside the proof-search clock.  The first successful
    # run constructs the complete cache; subsequent runs restore it.
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download frozen set.mm baseline
        run: |
          SETMM_COMMIT=0acf270b982d31fa1cd34f075116e7784869a480
          curl -L --fail --retry 3 \
            -o set.mm \
            "https://raw.githubusercontent.com/metamath/set.mm/${SETMM_COMMIT}/set.mm"
          wc -c set.mm
          sha256sum set.mm | tee setmm_sha256.txt

      - name: Build Halo(0) extension and manifest
        run: |
          cat set.mm hyperreal.mm > setmm_ext.mm
          printf '%s\n' \
            'TARGET: infmlen  |- ( f e. NPU -> ( Infml ` f ) ~~ RR )' \
            'SETMM_COMMIT=0acf270b982d31fa1cd34f075116e7784869a480' \
            'POLICY: target proof withheld; success requires an emitted certificate accepted by the independent Metamath verifier' \
            'SEARCH: Predator 8.003 R3I4 control law through 8.004 indexed wrapper' \
            'R=3: checked live metacontrol over observable search state; FOCUS/BALANCED/ESCAPE from stagnation and duplicate pressure' \
            'I=4: up to four further legal backward Metamath applications simulated in FUTUREBANK before ranking strongest successors' \
            'INDEX: FULL pre-target logical corpus; parallel parse; persistent cache; no assertion silently omitted' \
            'FAST PARSER: exact split-point pruning only; a variable endpoint is considered only where the next literal grammar token can match' \
            'CLOCK DISCIPLINE: preprocessing/index construction is outside the proof-search clock' \
            'CONTROL MATCH: target, budget, max-depth, agents, creativity, opener-cap and max-open unchanged from the intended first R3I4 run' \
            'PROOF SEARCH WALL CLOCK: hard 50-minute tranche' \
            'VERIFICATION: unchanged; imagination/metacontrol/indexing cannot alter certificate acceptance' \
            > halo0_r3i4_manifest.txt
          cat setmm_sha256.txt >> halo0_r3i4_manifest.txt

      - name: Formal syntax gate
        run: |
          set -o pipefail
          python setmm_grammar.py roundtrip setmm_ext.mm --sample 3000 | tee halo0_r3i4_roundtrip.log
          python setmm_grammar.py tree setmm_ext.mm df-infml | tee halo0_r3i4_df_infml_tree.log
          python setmm_grammar.py tree setmm_ext.mm infmlen | tee halo0_r3i4_infmlen_tree.log

      - name: R3I4 indexed import and selftest gate
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -o pipefail
          python -m py_compile 'predator 8/predator 8.003-R3I4.py'
          python -m py_compile 'predator 8/predator_index_cache.py'
          python -m py_compile 'predator 8/predator_fast_parse.py'
          python -m py_compile 'predator 8/predator 8.004-R3I4-indexed.py'
          python 'predator 8/predator 8.004-R3I4-indexed.py' selftest | tee halo0_r3i4_selftest.log

      - name: Restore full assertion-index cache
        id: index-cache
        uses: actions/cache@v4
        with:
          path: .cache/halo0_infmlen_full_index_v3.pkl
          key: halo0-infmlen-full-index-v3-0acf270b-${{ hashFiles('hyperreal.mm', 'setmm_grammar.py', 'predator 8/predator_index_cache.py', 'predator 8/predator_fast_parse.py') }}

      - name: Build or validate full pre-target assertion index
        env:
          PYTHONPATH: ${{ github.workspace }}
          PREDATOR_INDEX_CACHE: ${{ github.workspace }}/.cache/halo0_infmlen_full_index_v3.pkl
        run: |
          set -o pipefail
          mkdir -p .cache
          python 'predator 8/predator 8.004-R3I4-indexed.py' build-index setmm_ext.mm \
            --label infmlen 2>&1 | tee halo0_r3i4_index.log
          echo "INDEX_CACHE_HIT=${{ steps.index-cache.outputs.cache-hit }}" | tee -a halo0_r3i4_manifest.txt
          ls -lh .cache/halo0_infmlen_full_index_v3.pkl | tee -a halo0_r3i4_manifest.txt

      - name: Blind operational (3,4) Halo proof search — 50 minutes
        id: search
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
          PREDATOR_INDEX_CACHE: ${{ github.workspace }}/.cache/halo0_infmlen_full_index_v3.pkl
        run: |
          set +e
          set -o pipefail
          # The 50-minute clock begins only here, after the FULL index exists.
          timeout --signal=INT --kill-after=20s 50m \
            python 'predator 8/predator 8.004-R3I4-indexed.py' prove setmm_ext.mm \
              --label infmlen \
              --budget 50000000 \
              --max-depth 24 \
              --agents 8 \
              --creativity 0.65 \
              --opener-cap 96 \
              --max-open 10 \
              --seed "${GITHUB_RUN_NUMBER}" \
              --progress 1000 \
              --out infmlen_p8_r3i4.mm \
            2>&1 | tee halo0_r3i4_search.log
          rc=${PIPESTATUS[0]}
          echo "search_rc=$rc" >> "$GITHUB_OUTPUT"
          echo "SEARCH_RC=$rc" | tee -a halo0_r3i4_manifest.txt
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 130 ]; then
            echo 'OUTCOME=TIMEOUT_UNKNOWN' | tee -a halo0_r3i4_manifest.txt
          elif [ "$rc" -eq 0 ]; then
            echo 'OUTCOME=CANDIDATE_EMITTED' | tee -a halo0_r3i4_manifest.txt
          else
            echo 'OUTCOME=UNKNOWN_OR_PROTOCOL_FAILURE' | tee -a halo0_r3i4_manifest.txt
          fi
          exit 0

      - name: Verify emitted certificate independently
        if: hashFiles('infmlen_p8_r3i4.mm') != ''
        shell: bash
        run: |
          set -o pipefail
          python metamath.py verify infmlen_p8_r3i4.mm 2>&1 | tee halo0_r3i4_verifier.log
          echo 'VERIFIER_RAN=YES' | tee -a halo0_r3i4_manifest.txt

      - name: Record no-certificate outcome
        if: hashFiles('infmlen_p8_r3i4.mm') == ''
        run: |
          echo 'VERIFIER_RAN=NO' | tee -a halo0_r3i4_manifest.txt
          echo 'No certificate file was emitted in this 50-minute proof-search tranche.' | tee -a halo0_r3i4_manifest.txt

      - name: Upload run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: halo0-r3i4-indexfixed-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            halo0_r3i4_manifest.txt
            setmm_sha256.txt
            halo0_r3i4_roundtrip.log
            halo0_r3i4_df_infml_tree.log
            halo0_r3i4_infmlen_tree.log
            halo0_r3i4_selftest.log
            halo0_r3i4_index.log
            halo0_r3i4_search.log
            halo0_r3i4_verifier.log
            infmlen_p8_r3i4.mm
