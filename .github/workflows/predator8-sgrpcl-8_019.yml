name: Predator8 sgrpcl 8.019 selective controller

on:
  workflow_dispatch:
    inputs:
      budget:
        description: 'Global expansion budget'
        required: false
        default: '30000'
      seed:
        description: 'Random seed'
        required: false
        default: '2301'

permissions:
  contents: read

jobs:
  sgrpcl-8-019:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}/predator 8/recovered8_002
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: python -m pip install --quiet numpy scipy scikit-learn joblib

      - name: Reassemble and validate recovered 8.002 runtime
        shell: bash
        run: |
          set -euo pipefail
          cd 'predator 8/recovered8_002'
          cat runtime_chunks/part00.b64 runtime_chunks/part01.b64 runtime_chunks/part02.b64 \
              runtime_chunks/part03.b64 runtime_chunks/part04.b64 runtime_chunks/part05.b64 \
              runtime_chunks/part06.b64 runtime_chunks/part07.b64 runtime_chunks/part08.b64 \
              runtime_chunks/part09.b64 > /tmp/recovered8_002_runtime.b64
          test "$(wc -c < /tmp/recovered8_002_runtime.b64 | tr -d ' ')" = "167804"
          base64 -d /tmp/recovered8_002_runtime.b64 > /tmp/recovered8_002_runtime.zip
          test "$(sha256sum /tmp/recovered8_002_runtime.zip | awk '{print $1}')" = \
               "92b7fce75efb18a6a50b87729b4c286b14a9e89a94e4c7ffe054f3199252bac3"
          unzip -o /tmp/recovered8_002_runtime.zip
          python -m py_compile \
            Predator_8.001_FROZEN.py predator8_ml_ranker.py predator8_external_cv.py \
            setmm_grammar.py metamath.py predator8_015_bidirectional_attention.py \
            predator8_016_prcom_exactify.py predator8_017_fullgraph_exactify.py \
            predator8_018_bailout.py predator8_019_selective_sink.py \
            predator8_019_target.py bounded_exactifier.py

      - name: Download exact historical set.mm
        shell: bash
        run: |
          set -euo pipefail
          cd 'predator 8/recovered8_002'
          curl -L --retry 3 --fail \
            -o set.mm \
            https://raw.githubusercontent.com/metamath/set.mm/cd577894d8e6bf8b4fe8014c0d525d531507e4b7/set.mm
          ENV_SHA=$(sha256sum set.mm | awk '{print $1}')
          echo "environment_sha256=${ENV_SHA}" | tee recovered_hashes_sgrpcl_8_019.txt
          test "${ENV_SHA}" = "1016d7edb0508abde0fe240bb5243e588c5067f8cb10ee6e1cc5733fc05acdb5"

      - name: Run theorem-authority integration tests
        shell: bash
        run: |
          set -euo pipefail
          cd 'predator 8/recovered8_002'
          python -m unittest -v \
            test_predator8_016_prcom_exactify.py \
            test_bounded_exactifier.py \
            test_settlement_authority.py \
            test_predator8_authority_adapter.py \
            2>&1 | tee p8_019_sgrpcl_authority_tests.log

      - name: Run sgrpcl with 8.019 selective controller
        shell: bash
        run: |
          set +e
          set -uo pipefail
          cd 'predator 8/recovered8_002'
          BUDGET='${{ github.event.inputs.budget }}'
          SEED='${{ github.event.inputs.seed }}'
          BUDGET="${BUDGET:-30000}"
          SEED="${SEED:-2301}"
          BRUTE=$(( BUDGET / 5 ))
          python -u predator8_019_target.py set.mm \
            --engine Predator_8.001_FROZEN.py \
            --no-ml \
            --label sgrpcl \
            --budget "$BUDGET" \
            --brute-reserve "$BRUTE" \
            --max-depth 12 \
            --max-open 8 \
            --seed "$SEED" \
            --creativity 0.55 \
            --opener-cap 48 \
            --progress 250 \
            --frontier-limit 120000 \
            --probe-depth 3 \
            --probe-cap 2000 \
            --probe-total-cap 4000 \
            --probe-next-layer 30000 \
            --out sgrpcl_p8_019.mm \
            2>&1 | tee sgrpcl_p8_019.log
          RC=${PIPESTATUS[0]}
          echo "controller_rc=${RC}" | tee controller_rc_sgrpcl_8_019.txt
          if [ "$RC" -eq 2 ]; then exit 2; fi
          if [ "$RC" -ne 0 ] && [ "$RC" -ne 1 ]; then exit 2; fi
          exit 0

      - name: Independent certificate check if emitted
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd 'predator 8/recovered8_002'
          if [ -f sgrpcl_p8_019.mm ]; then
            python -u predator8_external_cv.py set.mm \
              --target sgrpcl --certificate sgrpcl_p8_019.mm | tee independent_cv_sgrpcl_8_019.log
          else
            echo "No certificate emitted." | tee independent_cv_sgrpcl_8_019.log
          fi

      - name: Summarize telemetry
        if: always()
        shell: bash
        run: |
          cd 'predator 8/recovered8_002'
          grep -E 'H-IMPROVE|SATURATE|INFO-GAIN|PROXIMITY-ALARM|EXACTIFY|FALSE-PROXIMITY|BAILOUT|SURGE|TORPOR|BRUTE|MEMORY-GUARD|CONTROL SUMMARY|OUTCOME|candidate found' \
            sgrpcl_p8_019.log 2>/dev/null || true
          echo '--- independent CV ---'
          cat independent_cv_sgrpcl_8_019.log 2>/dev/null || true

      - name: Upload experiment record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: predator8-sgrpcl-8-019-${{ github.run_id }}
          path: |
            predator 8/recovered8_002/recovered_hashes_sgrpcl_8_019.txt
            predator 8/recovered8_002/p8_019_sgrpcl_authority_tests.log
            predator 8/recovered8_002/sgrpcl_p8_019.log
            predator 8/recovered8_002/controller_rc_sgrpcl_8_019.txt
            predator 8/recovered8_002/independent_cv_sgrpcl_8_019.log
            predator 8/recovered8_002/sgrpcl_p8_019.mm
          if-no-files-found: ignore
