name: Predator8 prcom finite exhaustive proof bank legalcap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/predator8-prcom-finite-exhaustive-bank-legalcap.yml'
      - 'predator 8/recovered8_002/predator8_027_prcom_finite_exhaustive_bank_legalcap.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exhaustive-prcom-legalcap:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        candidate_cap: [8, 16, 32, 64]
    name: prcom exhaustive LEGAL cap${{ matrix.candidate_cap }} depth4
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}/predator 8/recovered8_002
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ML runtime
        run: python -m pip install --quiet numpy scipy scikit-learn joblib

      - name: Reassemble recovered 8.002 runtime
        shell: bash
        run: |
          set -euo pipefail
          cd 'predator 8/recovered8_002'
          cat runtime_chunks/part00.b64 runtime_chunks/part01.b64 runtime_chunks/part02.b64 \
              runtime_chunks/part03.b64 runtime_chunks/part04.b64 runtime_chunks/part05.b64 \
              runtime_chunks/part06.b64 runtime_chunks/part07.b64 runtime_chunks/part08.b64 \
              runtime_chunks/part09.b64 > /tmp/recovered8_002_runtime.b64
          test "$(wc -c < /tmp/recovered8_002_runtime.b64 | tr -d ' ')" = "167804"
          base64 -d /tmp/recovered8_002_runtime.b64 > /tmp/recovered8_002_runtime.zip
          test "$(sha256sum /tmp/recovered8_002_runtime.zip | awk '{print $1}')" = \
               "92b7fce75efb18a6a50b87729b4c286b14a9e89a94e4c7ffe054f3199252bac3"
          unzip -q -o /tmp/recovered8_002_runtime.zip
          python -m py_compile Predator_8.001_FROZEN.py predator8_ml_ranker.py \
            predator8_external_cv.py setmm_grammar.py metamath.py \
            predator8_015_bidirectional_attention.py predator8_016_prcom_exactify.py \
            predator8_026_prcom_finite_exhaustive_bank.py \
            predator8_027_prcom_finite_exhaustive_bank_legalcap.py

      - name: Download exact historical set.mm
        shell: bash
        run: |
          set -euo pipefail
          cd 'predator 8/recovered8_002'
          curl -L --retry 3 --fail -o set.mm \
            https://raw.githubusercontent.com/metamath/set.mm/cd577894d8e6bf8b4fe8014c0d525d531507e4b7/set.mm
          test "$(sha256sum set.mm | awk '{print $1}')" = \
               "1016d7edb0508abde0fe240bb5243e588c5067f8cb10ee6e1cc5733fc05acdb5"
          test "$(sha256sum prcom_quick_policy.joblib | awk '{print $1}')" = \
               "0531268d3f6b99038d001bfa64bbfebb304620ae7394dc61ca998377cf87884c"

      - name: Enumerate declared finite prcom LEGAL-successor proof space
        shell: bash
        run: |
          set +e
          set -uo pipefail
          cd 'predator 8/recovered8_002'
          K='${{ matrix.candidate_cap }}'
          STEM="exhaustive_prcom_legalcap${K}_d4"
          /usr/bin/time -f 'wall_seconds=%e' -o "${STEM}.time" \
          python -u predator8_027_prcom_finite_exhaustive_bank_legalcap.py \
            set.mm --engine Predator_8.001_FROZEN.py --model prcom_quick_policy.joblib \
            --label prcom --max-depth 4 --max-open 8 --candidate-cap "$K" \
            --max-expanded 250000 --max-frontier 500000 --progress 5000 \
            --bank-dir "${STEM}_bank" --summary "${STEM}.summary.json" \
            2>&1 | tee "${STEM}.log"
          RC=${PIPESTATUS[0]}
          echo "enumerator_rc=${RC}" > "${STEM}.run.txt"
          cat "${STEM}.time" >> "${STEM}.run.txt"
          grep -E '^\[BANKED\]|^\[PROGRESS\]|^OUTCOME:|COMPLETE WITHIN|INCOMPLETE ENUMERATION' "${STEM}.log" \
            | tail -n 200 >> "${STEM}.run.txt" || true
          if [ "$RC" -eq 2 ]; then exit 2; fi
          if [ "$RC" -ne 0 ] && [ "$RC" -ne 1 ]; then exit 2; fi
          exit 0

      - name: Upload exhaustive legalcap proof bank
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prcom-exhaustive-legalcap${{ matrix.candidate_cap }}-depth4-${{ github.run_id }}
          path: |
            predator 8/recovered8_002/exhaustive_prcom_legalcap${{ matrix.candidate_cap }}_d4.log
            predator 8/recovered8_002/exhaustive_prcom_legalcap${{ matrix.candidate_cap }}_d4.time
            predator 8/recovered8_002/exhaustive_prcom_legalcap${{ matrix.candidate_cap }}_d4.run.txt
            predator 8/recovered8_002/exhaustive_prcom_legalcap${{ matrix.candidate_cap }}_d4.summary.json
            predator 8/recovered8_002/exhaustive_prcom_legalcap${{ matrix.candidate_cap }}_d4_bank/**
          if-no-files-found: ignore
