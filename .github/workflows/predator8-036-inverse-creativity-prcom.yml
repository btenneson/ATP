name: Predator8 8.036 inverse creativity prcom

on:
  push:
    branches: [predator8-036-inverse-creativity-prcom]
    paths:
      - '.github/workflows/predator8-036-inverse-creativity-prcom.yml'
      - 'predator 8/recovered8_002/predator8_036_inverse_creativity_prcom.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: predator8-036-inverse-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inverse-prcom:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        treatment: [baseline-8029, group-e, x, x-inverse, x-inv-cM, x-inv-cN]
    name: INV ${{ matrix.treatment }} seed2302 C0-I5
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/predator 8/recovered8_002
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned ML runtime
        run: python -m pip install --quiet numpy scipy scikit-learn==1.8.0 joblib

      - name: Reassemble frozen Predator runtime
        shell: bash
        run: |
          set -euo pipefail
          cd 'predator 8/recovered8_002'
          cat runtime_chunks/part00.b64 runtime_chunks/part01.b64 runtime_chunks/part02.b64 \
              runtime_chunks/part03.b64 runtime_chunks/part04.b64 runtime_chunks/part05.b64 \
              runtime_chunks/part06.b64 runtime_chunks/part07.b64 runtime_chunks/part08.b64 \
              runtime_chunks/part09.b64 > /tmp/recovered8_002_runtime.b64
          base64 -d /tmp/recovered8_002_runtime.b64 > /tmp/recovered8_002_runtime.zip
          test "$(sha256sum /tmp/recovered8_002_runtime.zip | awk '{print $1}')" = \
               "92b7fce75efb18a6a50b87729b4c286b14a9e89a94e4c7ffe054f3199252bac3"
          unzip -q -o /tmp/recovered8_002_runtime.zip
          python -m py_compile \
            Predator_8.001_FROZEN.py predator8_ml_ranker.py predator8_external_cv.py \
            setmm_grammar.py metamath.py predator8_015_bidirectional_attention.py \
            predator8_016_prcom_exactify.py predator8_017_fullgraph_exactify.py \
            predator8_018_bailout.py predator8_019_selective_sink.py \
            predator8_028_prcom_quotient_awareness.py predator8_029_prcom_shortcut_macros.py \
            predator8_031_generalized_training.py predator8_033_bit_coupled_adaptive.py \
            predator8_035_c3_conservative_compilation.py \
            predator8_036_inverse_creativity_prcom.py \
            bounded_exactifier.py settlement_authority.py predator8_authority_adapter.py _loss.py

      - name: Download frozen historical set.mm
        shell: bash
        run: |
          set -euo pipefail
          cd 'predator 8/recovered8_002'
          curl -L --retry 3 --fail -o set.mm \
            https://raw.githubusercontent.com/metamath/set.mm/cd577894d8e6bf8b4fe8014c0d525d531507e4b7/set.mm
          test "$(sha256sum set.mm | awk '{print $1}')" = \
               "1016d7edb0508abde0fe240bb5243e588c5067f8cb10ee6e1cc5733fc05acdb5"
          test "$(sha256sum prcom_quick_policy.joblib | awk '{print $1}')" = \
               "0531268d3f6b99038d001bfa64bbfebb304620ae7394dc61ca998377cf87884c"

      - name: Run inverse-creativity treatment
        shell: bash
        run: |
          set +e
          set -uo pipefail
          cd 'predator 8/recovered8_002'
          T='${{ matrix.treatment }}'
          STEM="p8_036_INV_${T}_S2302"
          COMMON="--engine Predator_8.001_FROZEN.py --model prcom_quick_policy.joblib --label prcom --seed 2302 --budget 150 --brute-reserve 0 --max-open 8 --progress 25 --frontier-limit 120000 --probe-depth 0 --probe-cap 0 --probe-total-cap 0 --probe-next-layer 0 --out ${STEM}.mm"
          if [ "$T" = 'baseline-8029' ]; then
            /usr/bin/time -f 'wall_seconds=%e\nuser_seconds=%U\nsys_seconds=%S\nmax_rss_kb=%M' -o "${STEM}.time" \
              python -u predator8_029_prcom_shortcut_macros.py \
                --control-awareness 0 --imagination-awareness 5 set.mm $COMMON \
                2>&1 | tee "${STEM}.log"
          else
            /usr/bin/time -f 'wall_seconds=%e\nuser_seconds=%U\nsys_seconds=%S\nmax_rss_kb=%M' -o "${STEM}.time" \
              python -u predator8_036_inverse_creativity_prcom.py \
                set.mm --treatment "$T" $COMMON \
                2>&1 | tee "${STEM}.log"
          fi
          RC=${PIPESTATUS[0]}
          {
            echo "controller_rc=${RC}"
            echo "treatment=${T} seed=2302 C=0 I=5"
            cat "${STEM}.time" 2>/dev/null || true
            grep -E '^\[INV|^\[C3-CERT|^\[SHORTCUT|^\[QUOTIENT|CONTROL SUMMARY|candidate found|OUTCOME:|CERTIFIED-ZERO|FALSE-ZERO' "${STEM}.log" | tail -n 300 || true
          } > "${STEM}.summary"
          if [ "$RC" -eq 2 ]; then exit 2; fi
          if [ "$RC" -ne 0 ] && [ "$RC" -ne 1 ]; then exit 2; fi
          exit 0

      - name: Independent certificate check if emitted
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd 'predator 8/recovered8_002'
          T='${{ matrix.treatment }}'; STEM="p8_036_INV_${T}_S2302"
          if [ -f "${STEM}.mm" ]; then
            python -u predator8_external_cv.py set.mm \
              --target prcom --certificate "${STEM}.mm" | tee "${STEM}.cv.log"
          else
            echo 'No certificate emitted.' | tee "${STEM}.cv.log"
          fi

      - name: Upload inverse treatment record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p8-036-inverse-${{ matrix.treatment }}-S2302-${{ github.run_id }}
          path: |
            predator 8/recovered8_002/p8_036_INV_${{ matrix.treatment }}_S2302.log
            predator 8/recovered8_002/p8_036_INV_${{ matrix.treatment }}_S2302.summary
            predator 8/recovered8_002/p8_036_INV_${{ matrix.treatment }}_S2302.time
            predator 8/recovered8_002/p8_036_INV_${{ matrix.treatment }}_S2302.cv.log
            predator 8/recovered8_002/p8_036_INV_${{ matrix.treatment }}_S2302.mm
          if-no-files-found: ignore
          retention-days: 90
