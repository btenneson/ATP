name: Predator8 prcom raw root-value probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/predator8-prcom-raw-value-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  raw-value-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}/predator 8/recovered8_002
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ML runtime
        run: python -m pip install --quiet numpy scipy scikit-learn joblib
      - name: Reassemble recovered 8.002 runtime
        shell: bash
        run: |
          set -euo pipefail
          cd 'predator 8/recovered8_002'
          cat runtime_chunks/part00.b64 runtime_chunks/part01.b64 runtime_chunks/part02.b64 \
              runtime_chunks/part03.b64 runtime_chunks/part04.b64 runtime_chunks/part05.b64 \
              runtime_chunks/part06.b64 runtime_chunks/part07.b64 runtime_chunks/part08.b64 \
              runtime_chunks/part09.b64 > /tmp/recovered8_002_runtime.b64
          test "$(wc -c < /tmp/recovered8_002_runtime.b64 | tr -d ' ')" = "167804"
          base64 -d /tmp/recovered8_002_runtime.b64 > /tmp/recovered8_002_runtime.zip
          test "$(sha256sum /tmp/recovered8_002_runtime.zip | awk '{print $1}')" = \
               "92b7fce75efb18a6a50b87729b4c286b14a9e89a94e4c7ffe054f3199252bac3"
          unzip -q -o /tmp/recovered8_002_runtime.zip
          python -m py_compile \
            Predator_8.001_FROZEN.py predator8_ml_ranker.py predator8_external_cv.py \
            setmm_grammar.py metamath.py predator8_015_bidirectional_attention.py \
            predator8_016_prcom_exactify.py predator8_017_fullgraph_exactify.py \
            predator8_018_bailout.py predator8_019_selective_sink.py \
            predator8_019_awareness_grid.py predator8_022_raw_value_probe.py \
            bounded_exactifier.py settlement_authority.py predator8_authority_adapter.py _loss.py
      - name: Download exact historical set.mm
        shell: bash
        run: |
          set -euo pipefail
          cd 'predator 8/recovered8_002'
          curl -L --retry 3 --fail -o set.mm \
            https://raw.githubusercontent.com/metamath/set.mm/cd577894d8e6bf8b4fe8014c0d525d531507e4b7/set.mm
          test "$(sha256sum set.mm | awk '{print $1}')" = \
               "1016d7edb0508abde0fe240bb5243e588c5067f8cb10ee6e1cc5733fc05acdb5"
          test "$(sha256sum prcom_quick_policy.joblib | awk '{print $1}')" = \
               "0531268d3f6b99038d001bfa64bbfebb304620ae7394dc61ca998377cf87884c"
      - name: Probe raw root geometry at C0 I4
        shell: bash
        run: |
          set +e
          set -uo pipefail
          cd 'predator 8/recovered8_002'
          python -u predator8_022_raw_value_probe.py \
            --control-awareness 0 --imagination-awareness 4 \
            set.mm --engine Predator_8.001_FROZEN.py --model prcom_quick_policy.joblib \
            --label prcom --budget 1 --brute-reserve 0 --max-depth 12 --max-open 8 \
            --seed 2301 --creativity 0.55 --opener-cap 48 --progress 0 \
            --frontier-limit 120000 --probe-depth 3 --probe-cap 0 \
            --probe-total-cap 0 --probe-next-layer 30000 --out raw_value_probe.mm \
            2>&1 | tee raw_value_probe.log
          RC=${PIPESTATUS[0]}
          grep 'RAW-VALUE' raw_value_probe.log > raw_value_probe.tsv || true
          if [ "$RC" -eq 2 ]; then exit 2; fi
          exit 0
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prcom-raw-root-value-probe-${{ github.run_id }}
          path: |
            predator 8/recovered8_002/raw_value_probe.log
            predator 8/recovered8_002/raw_value_probe.tsv
          if-no-files-found: error
