name: Settlement Compass Clean Shells MAX Repaired

on:
  push:
    paths:
      - 'optimizations/settlement_compass/src/run_experiment_004_repaired.py'
      - '.github/workflows/settlement-compass-clean-shells-max-repaired.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-shells-max-repaired:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip scikit-learn scipy numpy
      - name: Fetch frozen set.mm snapshot
        run: |
          curl -fsSL https://raw.githubusercontent.com/metamath/set.mm/develop/set.mm -o /tmp/set.mm
          test "$(sha256sum /tmp/set.mm | awk '{print $1}')" = "7b70cd8cca88aeb72a8dd97029d0b506015fb0325afec581cdc9add8ca0c8547"
      - name: Run identical Experiment 004 through repaired launcher
        env:
          SETMM_PATH: /tmp/set.mm
          COMPASS_RESULTS_DIR: optimizations/settlement_compass/results
        run: |
          mkdir -p optimizations/settlement_compass/results
          python optimizations/settlement_compass/src/run_experiment_004_repaired.py
      - name: Commit manifest and results
        if: always()
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add optimizations/settlement_compass/results/experiment_004_manifest.json || true
          git add optimizations/settlement_compass/results/experiment_004_shell_results.json || true
          git add optimizations/settlement_compass/results/experiment_004_rows.csv || true
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'record repaired clean compass shells and MAX experiment'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
