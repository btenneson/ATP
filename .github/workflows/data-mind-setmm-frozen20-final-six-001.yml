name: DATA-MIND set.mm Frozen-20 Benchmark 001 — final six

on:
  push:
    branches: [experiment/data-mind-setmm-frozen20-001]
    paths:
      - '.github/workflows/data-mind-setmm-frozen20-final-six-001.yml'
      - 'experiments/run_dm212_setmm_target_ordinal.py'
      - 'experiments/data_mind_2_12_setmm_holdout.py'
      - 'experiments/build_frozen20_manifest.py'
      - 'benchmarks/data-mind-setmm-frozen20-001/manifest.json'
      - 'metamath.py'
  workflow_dispatch:

env:
  SETMM_COMMIT: f85a8edbb6df20dd5a64a9c159fa22944a3e54de
  SPLIT_SEED: '271828'
  HOLDOUT_FRACTION: '0.05'
  TARGET_SECONDS: '1800'
  PYTHONPATH: .

jobs:
  heldout-target:
    name: frozen20-${{ matrix.target_ordinal }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        target_ordinal: [14, 15, 16, 17, 18, 19]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Self-tests
        run: |
          set -euo pipefail
          python -m py_compile experiments/data_mind_2_12_setmm_holdout.py experiments/run_dm212_setmm_target_ordinal.py experiments/build_frozen20_manifest.py metamath.py
          python -m unittest tests.test_dm212_setmm_holdout -v
          python metamath.py selftest
      - name: Fetch and validate frozen set.mm
        run: |
          set -euo pipefail
          curl -fL --retry 8 --retry-all-errors --retry-delay 3 --connect-timeout 30 --max-time 300 --output set.mm "https://raw.githubusercontent.com/metamath/set.mm/${SETMM_COMMIT}/set.mm"
          echo '19cb1ec229f3f11e36ff439a6381878864d9f2d4906f20fc9401346b309894e3  set.mm' | sha256sum -c -
          python metamath.py verify set.mm --limit 2000 --progress 1000
          python experiments/build_frozen20_manifest.py --setmm set.mm --out regenerated-manifest.json
          cmp regenerated-manifest.json benchmarks/data-mind-setmm-frozen20-001/manifest.json
      - name: Run held-out target
        run: |
          set -euo pipefail
          OUT="results/frozen20-target-${{ matrix.target_ordinal }}"
          mkdir -p "$OUT"
          python -u experiments/run_dm212_setmm_target_ordinal.py --target-ordinal "${{ matrix.target_ordinal }}" --setmm set.mm --source-commit "$SETMM_COMMIT" --seed "$SPLIT_SEED" --holdout-fraction "$HOLDOUT_FRACTION" --seconds "$TARGET_SECONDS" --out "$OUT" 2>&1 | tee "$OUT/run.log"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-mind-setmm-frozen20-target-${{ matrix.target_ordinal }}-${{ github.run_id }}
          path: |
            results/frozen20-target-${{ matrix.target_ordinal }}/
            benchmarks/data-mind-setmm-frozen20-001/manifest.json
          if-no-files-found: warn
          retention-days: 90
