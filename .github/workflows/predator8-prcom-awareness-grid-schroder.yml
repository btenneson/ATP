name: Predator8 prcom 16-pair awareness grid Schroder-flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/predator8-prcom-awareness-grid-schroder.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prcom-awareness-grid-schroder:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        control: [0, 2, 4, 5]
        imagination: [0, 2, 4, 5]
    name: prcom Schroder C${{ matrix.control }} I${{ matrix.imagination }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}/predator 8/recovered8_002
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ML runtime
        run: python -m pip install --quiet numpy scipy scikit-learn joblib

      - name: Reassemble recovered 8.002 runtime
        shell: bash
        run: |
          set -euo pipefail
          cd 'predator 8/recovered8_002'
          cat runtime_chunks/part00.b64 runtime_chunks/part01.b64 runtime_chunks/part02.b64 \
              runtime_chunks/part03.b64 runtime_chunks/part04.b64 runtime_chunks/part05.b64 \
              runtime_chunks/part06.b64 runtime_chunks/part07.b64 runtime_chunks/part08.b64 \
              runtime_chunks/part09.b64 > /tmp/recovered8_002_runtime.b64
          test "$(wc -c < /tmp/recovered8_002_runtime.b64 | tr -d ' ')" = "167804"
          base64 -d /tmp/recovered8_002_runtime.b64 > /tmp/recovered8_002_runtime.zip
          test "$(sha256sum /tmp/recovered8_002_runtime.zip | awk '{print $1}')" = \
               "92b7fce75efb18a6a50b87729b4c286b14a9e89a94e4c7ffe054f3199252bac3"
          unzip -q -o /tmp/recovered8_002_runtime.zip
          python -m py_compile \
            Predator_8.001_FROZEN.py predator8_ml_ranker.py predator8_external_cv.py \
            setmm_grammar.py metamath.py predator8_015_bidirectional_attention.py \
            predator8_016_prcom_exactify.py predator8_017_fullgraph_exactify.py \
            predator8_018_bailout.py predator8_019_selective_sink.py \
            predator8_019_awareness_grid.py predator8_020_awareness_grid_schroder.py \
            bounded_exactifier.py settlement_authority.py predator8_authority_adapter.py _loss.py

      - name: Download exact historical set.mm
        shell: bash
        run: |
          set -euo pipefail
          cd 'predator 8/recovered8_002'
          curl -L --retry 3 --fail -o set.mm \
            https://raw.githubusercontent.com/metamath/set.mm/cd577894d8e6bf8b4fe8014c0d525d531507e4b7/set.mm
          test "$(sha256sum set.mm | awk '{print $1}')" = \
               "1016d7edb0508abde0fe240bb5243e588c5067f8cb10ee6e1cc5733fc05acdb5"
          test "$(sha256sum prcom_quick_policy.joblib | awk '{print $1}')" = \
               "0531268d3f6b99038d001bfa64bbfebb304620ae7394dc61ca998377cf87884c"

      - name: Run prcom with local H descent plus Schroder contraction
        shell: bash
        run: |
          set +e
          set -uo pipefail
          cd 'predator 8/recovered8_002'
          C='${{ matrix.control }}'
          I='${{ matrix.imagination }}'
          STEM="prcom_schroder_C${C}_I${I}"
          /usr/bin/time -f 'wall_seconds=%e' -o "${STEM}.time" \
          python -u predator8_020_awareness_grid_schroder.py \
            --control-awareness "$C" \
            --imagination-awareness "$I" \
            set.mm \
            --engine Predator_8.001_FROZEN.py \
            --model prcom_quick_policy.joblib \
            --label prcom \
            --budget 30000 \
            --brute-reserve 6000 \
            --max-depth 12 \
            --max-open 8 \
            --seed 2301 \
            --creativity 0.55 \
            --opener-cap 48 \
            --progress 250 \
            --frontier-limit 120000 \
            --probe-depth 3 \
            --probe-cap 2000 \
            --probe-total-cap 4000 \
            --probe-next-layer 30000 \
            --out "${STEM}.mm" \
            2>&1 | tee "${STEM}.log"
          RC=${PIPESTATUS[0]}
          echo "controller_rc=${RC}" > "${STEM}.summary"
          cat "${STEM}.time" >> "${STEM}.summary"
          grep -E 'OUTCOME:|CONTROL SUMMARY|candidate found|CERTIFIED-ZERO|FALSE-ZERO|H-IMPROVE|SCHRODER-FLOW' "${STEM}.log" \
            | tail -n 60 >> "${STEM}.summary" || true
          if [ "$RC" -eq 2 ]; then exit 2; fi
          if [ "$RC" -ne 0 ] && [ "$RC" -ne 1 ]; then exit 2; fi
          exit 0

      - name: Independent certificate check if emitted
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd 'predator 8/recovered8_002'
          C='${{ matrix.control }}'; I='${{ matrix.imagination }}'
          STEM="prcom_schroder_C${C}_I${I}"
          if [ -f "${STEM}.mm" ]; then
            python -u predator8_external_cv.py set.mm \
              --target prcom --certificate "${STEM}.mm" | tee "${STEM}.cv.log"
          else
            echo 'No certificate emitted.' | tee "${STEM}.cv.log"
          fi

      - name: Upload pair record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prcom-schroder-C${{ matrix.control }}-I${{ matrix.imagination }}-${{ github.run_id }}
          path: |
            predator 8/recovered8_002/prcom_schroder_C${{ matrix.control }}_I${{ matrix.imagination }}.log
            predator 8/recovered8_002/prcom_schroder_C${{ matrix.control }}_I${{ matrix.imagination }}.summary
            predator 8/recovered8_002/prcom_schroder_C${{ matrix.control }}_I${{ matrix.imagination }}.time
            predator 8/recovered8_002/prcom_schroder_C${{ matrix.control }}_I${{ matrix.imagination }}.cv.log
            predator 8/recovered8_002/prcom_schroder_C${{ matrix.control }}_I${{ matrix.imagination }}.mm
          if-no-files-found: ignore
