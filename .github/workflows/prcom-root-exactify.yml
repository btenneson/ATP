name: prcom exact settlement-shell probe

on:
  push:
    branches: [main]
    paths:
      - 'predator 8/recovered8_002/prcom_root_exactify.py'
      - 'predator 8/recovered8_002/run_prcom_root_exactify_guarded.py'
      - 'predator 8/recovered8_002/bounded_exactifier.py'
      - 'predator 8/recovered8_002/settlement_authority.py'
      - '.github/workflows/prcom-root-exactify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exactify-prcom-root:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/predator 8/recovered8_002
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download historical prcom environment
        shell: bash
        run: |
          set -euo pipefail
          curl -L --retry 3 --fail \
            -o set.mm \
            https://raw.githubusercontent.com/metamath/set.mm/cd577894d8e6bf8b4fe8014c0d525d531507e4b7/set.mm
          sha256sum set.mm | tee prcom_exactify_setmm_sha256.txt
          test "$(sha256sum set.mm | awk '{print $1}')" = "1016d7edb0508abde0fe240bb5243e588c5067f8cb10ee6e1cc5733fc05acdb5"

      - name: Compile and safety-test exactifier
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            "predator 8/predator 8.001.py" \
            "predator 8/recovered8_002/settlement_authority.py" \
            "predator 8/recovered8_002/bounded_exactifier.py" \
            "predator 8/recovered8_002/prcom_root_exactify.py" \
            "predator 8/recovered8_002/run_prcom_root_exactify_guarded.py"
          python -u "predator 8/predator 8.001.py" selftest | tee prcom_exactify_base_selftest.log
          cd 'predator 8/recovered8_002'
          python -m unittest -v test_settlement_authority.py test_bounded_exactifier.py test_predator8_authority_adapter.py | tee ../../prcom_exactify_authority_tests.log

      - name: Run 30000-expansion exact root probe
        shell: bash
        run: |
          set +e
          set -uo pipefail
          cd 'predator 8/recovered8_002'
          python -u run_prcom_root_exactify_guarded.py ../../set.mm \
            --engine '../predator 8.001.py' \
            --target prcom \
            --depth 5 \
            --budget 30000 \
            --out prcom_exactify.mm \
            2>&1 | tee prcom_root_exactify.log
          RC=${PIPESTATUS[0]}
          echo "exactifier_rc=${RC}" | tee prcom_root_exactify_rc.txt
          if [ "$RC" -eq 2 ]; then
            echo "PROTOCOL FAILURE" >&2
            exit 2
          fi
          if [ "$RC" -ne 0 ] && [ "$RC" -ne 1 ]; then
            echo "unexpected exactifier rc=$RC" >&2
            exit 2
          fi
          exit 0

      - name: Independently verify emitted certificate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f 'predator 8/recovered8_002/prcom_exactify.mm' ]; then
            cp set.mm 'predator 8/recovered8_002/set.mm'
            python metamath.py verify 'predator 8/recovered8_002/prcom_exactify.mm' | tee prcom_exactify_independent_verifier.log
          else
            echo 'No certificate emitted.' | tee prcom_exactify_independent_verifier.log
          fi

      - name: Summarize exactification result
        if: always()
        shell: bash
        run: |
          echo '--- exactification result ---'
          grep -E 'ROOT EXACTIFY|PROBE|CERTIFIED RESULT|elapsed' \
            'predator 8/recovered8_002/prcom_root_exactify.log' 2>/dev/null || true
          echo '--- independent verifier ---'
          cat prcom_exactify_independent_verifier.log 2>/dev/null || true

      - name: Upload exactification record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prcom-root-exactify-${{ github.run_id }}
          path: |
            prcom_exactify_setmm_sha256.txt
            prcom_exactify_base_selftest.log
            prcom_exactify_authority_tests.log
            prcom_exactify_independent_verifier.log
            predator 8/recovered8_002/prcom_root_exactify.log
            predator 8/recovered8_002/prcom_root_exactify_rc.txt
            predator 8/recovered8_002/prcom_exactify.mm
          if-no-files-found: ignore
