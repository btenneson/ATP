name: Ocean professional ATP benchmark

on:
  push:
    paths:
      - 'benchmarks/ocean/**'
      - '.github/workflows/ocean-professional-atp-benchmark.yml'
  pull_request:
    paths:
      - 'benchmarks/ocean/**'
      - '.github/workflows/ocean-professional-atp-benchmark.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate and verify 20 frozen L*=10 oceans
        run: python benchmarks/ocean/generate_ocean_tptp.py --seeds 20 --lengths 10

      - name: Install build tools and SPASS
        run: |
          sudo apt-get update
          sudo apt-get install -y spass build-essential git cmake jq gawk
          SPASS -h 2>&1 | head -20 || true

      - name: Build E Prover from official repository
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/eprover/eprover.git "$RUNNER_TEMP/eprover"
          git -C "$RUNNER_TEMP/eprover" rev-parse HEAD | tee benchmarks/ocean/results_eprover_commit.txt
          cd "$RUNNER_TEMP/eprover"
          ./configure
          make rebuild
          EPROVER_BIN="$RUNNER_TEMP/eprover/PROVER/eprover"
          test -x "$EPROVER_BIN"
          echo "EPROVER_BIN=$EPROVER_BIN" >> "$GITHUB_ENV"
          "$EPROVER_BIN" --version

      - name: Install Vampire 5.0.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vampire"
          python - <<'PY'
          import json, os, pathlib, urllib.request
          url='https://api.github.com/repos/vprover/vampire/releases/tags/v5.0.1'
          req=urllib.request.Request(url,headers={'Accept':'application/vnd.github+json','User-Agent':'ocean-benchmark'})
          rel=json.load(urllib.request.urlopen(req))
          assets=rel.get('assets',[])
          print('Vampire release assets:', [a['name'] for a in assets])
          def rank(a):
              n=a['name'].lower()
              linux='linux' in n
              x86=any(x in n for x in ('x86_64','x86-64','amd64','x64'))
              source=any(x in n for x in ('source','src'))
              return (linux and x86 and not source, linux and not source, not source)
          candidates=sorted(assets,key=rank,reverse=True)
          if not candidates or not rank(candidates[0])[1]:
              raise SystemExit('No suitable Linux Vampire release asset found')
          a=candidates[0]
          dest=pathlib.Path(os.environ['RUNNER_TEMP'])/'vampire'/a['name']
          urllib.request.urlretrieve(a['browser_download_url'],dest)
          print('Downloaded',a['name'],a['browser_download_url'])
          PY
          ASSET=$(find "$RUNNER_TEMP/vampire" -maxdepth 1 -type f | head -1)
          case "$ASSET" in
            *.tar.gz|*.tgz) tar -xzf "$ASSET" -C "$RUNNER_TEMP/vampire" ;;
            *.tar.xz) tar -xJf "$ASSET" -C "$RUNNER_TEMP/vampire" ;;
            *.zip) unzip -q "$ASSET" -d "$RUNNER_TEMP/vampire" ;;
            *) chmod +x "$ASSET" ;;
          esac
          VAMPIRE_BIN=$(find "$RUNNER_TEMP/vampire" -type f \( -name 'vampire' -o -name 'vampire*' \) -not -name '*.tar*' -not -name '*.zip' | head -1)
          if [ -z "$VAMPIRE_BIN" ]; then echo 'Vampire binary not found after extraction'; find "$RUNNER_TEMP/vampire" -maxdepth 3 -type f; exit 1; fi
          chmod +x "$VAMPIRE_BIN"
          echo "VAMPIRE_BIN=$VAMPIRE_BIN" >> "$GITHUB_ENV"
          "$VAMPIRE_BIN" --version || "$VAMPIRE_BIN" -h | head || true

      - name: Install current LADR-2026 Prover9
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/AlgorithmicTruth/Prover9.git "$RUNNER_TEMP/Prover9"
          git -C "$RUNNER_TEMP/Prover9" rev-parse HEAD | tee benchmarks/ocean/results_prover9_commit.txt
          make -C "$RUNNER_TEMP/Prover9" all
          PROVER9_BIN="$RUNNER_TEMP/Prover9/bin/prover9"
          test -x "$PROVER9_BIN"
          echo "PROVER9_BIN=$PROVER9_BIN" >> "$GITHUB_ENV"
          "$PROVER9_BIN" -h | head -20 || true

      - name: Record environment and exact binaries
        shell: bash
        run: |
          mkdir -p benchmarks/ocean/results/professional
          {
            echo "runner=$(uname -a)"
            echo "python=$(python --version 2>&1)"
            echo "eprover=$EPROVER_BIN"
            "$EPROVER_BIN" --version 2>&1 | head -5 || true
            echo "eprover_commit=$(cat benchmarks/ocean/results_eprover_commit.txt)"
            echo "spass=$(command -v SPASS)"
            echo "vampire=$VAMPIRE_BIN"
            "$VAMPIRE_BIN" --version 2>&1 | head -5 || true
            echo "prover9=$PROVER9_BIN"
            echo "prover9_commit=$(cat benchmarks/ocean/results_prover9_commit.txt)"
          } > benchmarks/ocean/results/professional/environment.txt
          cat benchmarks/ocean/results/professional/environment.txt

      - name: Run 20 L*=10 instances with 60-second hard breakpoint
        run: python benchmarks/ocean/run_professional_atps.py

      - name: Show summary
        if: always()
        run: cat benchmarks/ocean/results/professional/summary.json || true

      - name: Upload proofs, manifest, and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocean-professional-atp-results-L10
          path: |
            benchmarks/ocean/generated/
            benchmarks/ocean/results/professional/
            benchmarks/ocean/results_eprover_commit.txt
            benchmarks/ocean/results_prover9_commit.txt
          retention-days: 90
