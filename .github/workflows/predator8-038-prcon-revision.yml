name: Predator8 8.038 prcon revision tau025

on:
  push:
    branches: [predator8-038-eight-agent-revision-fallback]
    paths:
      - '.github/workflows/predator8-038-prcon-revision.yml'
      - 'experiments/P8_038_PRCON_EXPERIMENT.md'
      - 'experiments/P8_038_PRCON_ATTEMPT_HISTORY.md'
      - 'predator 8/predator 8.001.py'
      - 'metamath.py'
      - 'setmm_grammar.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: predator8-038-prcon-revision-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  preflight:
    name: Preflight compile, verifier, ATP self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile dependencies and ATP
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            metamath.py \
            setmm_grammar.py \
            'predator 8/predator 8.001.py'

      - name: Self-test independent Metamath verifier
        shell: bash
        run: |
          set -euo pipefail
          python -u metamath.py selftest | tee metamath_selftest.log

      - name: Self-test Predator 8.001
        shell: bash
        run: |
          set -euo pipefail
          python -u 'predator 8/predator 8.001.py' selftest | tee predator8_selftest.log

  prcon-agent:
    needs: preflight
    name: prcon ${{ matrix.agent }} c=${{ matrix.creativity }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - agent: P1
            seed: 2301
            creativity: '0.15'
          - agent: P2
            seed: 2302
            creativity: '0.25'
          - agent: R1
            seed: 2303
            creativity: '0.35'
          - agent: R2
            seed: 2304
            creativity: '0.45'
          - agent: I1
            seed: 2305
            creativity: '0.55'
          - agent: I2
            seed: 2306
            creativity: '0.65'
          - agent: C1
            seed: 2307
            creativity: '0.75'
          - agent: C2
            seed: 2308
            creativity: '0.85'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download and authenticate frozen set.mm
        shell: bash
        run: |
          set -euo pipefail
          curl -L --retry 3 --fail \
            -o set.mm \
            https://raw.githubusercontent.com/metamath/set.mm/0acf270b982d31fa1cd34f075116e7784869a480/set.mm
          sha256sum set.mm | tee setmm_sha256.txt
          test "$(sha256sum set.mm | awk '{print $1}')" = \
            '6a3a85893ac908d3c0ac081e817f40bf2083d1b2d511a09fd0b762cd9b1861a1'

      - name: Phase 1 ordinary search with federation halt watch
        id: phase1
        shell: bash
        env:
          AGENT: ${{ matrix.agent }}
          SEED: ${{ matrix.seed }}
          C0: ${{ matrix.creativity }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          set -uo pipefail
          mkdir -p results
          BUDGET=12000
          COMMON="--label prcon --budget ${BUDGET} --max-depth 12 --max-open 8 --opener-cap 64 --agents 1 --progress 500"

          peer_settled() {
            JSON=$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
              2>/dev/null) || return 1
            printf '%s' "$JSON" | python -c \
              'import json,sys; d=json.load(sys.stdin); sys.exit(0 if any(a.get("name","").startswith("p8-038-SETTLED-") for a in d.get("artifacts",[])) else 1)'
          }

          {
            echo "attempt=3-tau025"
            echo "agent=${AGENT}"
            echo "seed=${SEED}"
            echo "phase1_creativity=${C0}"
            echo "phase_budget=${BUDGET}"
            echo "tau=0.25"
            echo "threshold_rule=D>0.25 triggers group-inverse revision"
            echo "V(z)=1 required for every accepted settlement"
            echo "federation_halt=cooperative run-scoped verified-settlement signal"
          } | tee results/summary.txt

          if peer_settled; then
            echo 'phase1_status=HALTED_BEFORE_START_BY_VERIFIED_PEER' | tee -a results/summary.txt
            echo 'rc=halted' >> "$GITHUB_OUTPUT"
            echo 'halted=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python -u 'predator 8/predator 8.001.py' prove set.mm $COMMON \
            --creativity "${C0}" --seed "${SEED}" \
            --out "results/${AGENT}_phase1.mm" \
            > "results/phase1.log" 2>&1 &
          PID=$!
          HALTED=false

          while kill -0 "$PID" 2>/dev/null; do
            if peer_settled; then
              HALTED=true
              kill -TERM "$PID" 2>/dev/null || true
              sleep 1
              kill -KILL "$PID" 2>/dev/null || true
              wait "$PID" 2>/dev/null || true
              break
            fi
            sleep 3
          done

          if [ "$HALTED" = true ]; then
            echo 'phase1_status=HALTED_DURING_SEARCH_BY_VERIFIED_PEER' | tee -a results/summary.txt
            tail -n 80 results/phase1.log || true
            echo 'rc=halted' >> "$GITHUB_OUTPUT"
            echo 'halted=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          wait "$PID"
          RC=$?
          cat results/phase1.log
          echo "phase1_rc=${RC}" | tee -a results/summary.txt

          if [ "$RC" -eq 0 ]; then
            echo 'phase1_D=0.0' | tee -a results/summary.txt
            echo 'revision_fired=false' | tee -a results/summary.txt
          elif [ "$RC" -eq 1 ]; then
            echo 'phase1_D=1.0' | tee -a results/summary.txt
            echo 'revision_fired=true' | tee -a results/summary.txt
          else
            echo "PROTOCOL FAILURE phase1 rc=${RC}" | tee -a results/summary.txt >&2
            exit 2
          fi
          echo "rc=${RC}" >> "$GITHUB_OUTPUT"
          echo 'halted=false' >> "$GITHUB_OUTPUT"
          exit 0

      - name: Independently verify phase 1 certificate
        if: steps.phase1.outputs.rc == '0'
        id: verify1
        shell: bash
        env:
          AGENT: ${{ matrix.agent }}
        run: |
          set -euo pipefail
          test -s "results/${AGENT}_phase1.mm"
          python -u metamath.py verify "results/${AGENT}_phase1.mm" \
            --only chk --progress 0 \
            2>&1 | tee results/phase1_independent_verify.log
          grep -Eq '^  verified[[:space:]]+1$' results/phase1_independent_verify.log
          {
            echo "agent=${AGENT}"
            echo 'phase=1'
            echo 'independent_V=1'
            echo "run_id=${GITHUB_RUN_ID}"
            echo "commit=${GITHUB_SHA}"
          } > results/settlement.signal
          echo 'phase1_independent_V=1' | tee -a results/summary.txt
          echo 'verified=true' >> "$GITHUB_OUTPUT"

      - name: Publish phase 1 verified-settlement signal
        if: steps.verify1.outputs.verified == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: p8-038-SETTLED-${{ matrix.agent }}-phase1-${{ github.run_id }}
          path: results/settlement.signal
          if-no-files-found: error
          retention-days: 90

      - name: Check federation settlement before revision
        if: steps.phase1.outputs.rc == '1'
        id: peercheck
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          JSON=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100")
          if printf '%s' "$JSON" | python -c \
            'import json,sys; d=json.load(sys.stdin); sys.exit(0 if any(a.get("name","").startswith("p8-038-SETTLED-") for a in d.get("artifacts",[])) else 1)'; then
            echo 'settled=true' >> "$GITHUB_OUTPUT"
            echo 'halted_before_phase2_by_verified_peer=true' | tee -a results/summary.txt
          else
            echo 'settled=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Compute group inverse creativity
        if: steps.phase1.outputs.rc == '1' && steps.peercheck.outputs.settled != 'true'
        id: inverse
        shell: bash
        env:
          C0: ${{ matrix.creativity }}
        run: |
          set -euo pipefail
          CINV=$(python - <<'PY'
          import os
          c=float(os.environ['C0'])
          print(f"{1.0-c:.12g}")
          PY
          )
          echo "cinv=${CINV}" >> "$GITHUB_OUTPUT"
          echo "phase2_creativity=${CINV}" | tee -a results/summary.txt

      - name: Phase 2 inverse-revision search with federation halt watch
        if: steps.phase1.outputs.rc == '1' && steps.peercheck.outputs.settled != 'true'
        id: phase2
        shell: bash
        env:
          AGENT: ${{ matrix.agent }}
          SEED: ${{ matrix.seed }}
          CINV: ${{ steps.inverse.outputs.cinv }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          set -uo pipefail
          BUDGET=12000
          COMMON="--label prcon --budget ${BUDGET} --max-depth 12 --max-open 8 --opener-cap 64 --agents 1 --progress 500"

          peer_settled() {
            JSON=$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
              2>/dev/null) || return 1
            printf '%s' "$JSON" | python -c \
              'import json,sys; d=json.load(sys.stdin); sys.exit(0 if any(a.get("name","").startswith("p8-038-SETTLED-") for a in d.get("artifacts",[])) else 1)'
          }

          if peer_settled; then
            echo 'phase2_status=HALTED_BEFORE_START_BY_VERIFIED_PEER' | tee -a results/summary.txt
            echo 'rc=halted' >> "$GITHUB_OUTPUT"
            echo 'halted=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python -u 'predator 8/predator 8.001.py' prove set.mm $COMMON \
            --creativity "${CINV}" --seed "${SEED}" \
            --out "results/${AGENT}_phase2_inverse.mm" \
            > "results/phase2.log" 2>&1 &
          PID=$!
          HALTED=false

          while kill -0 "$PID" 2>/dev/null; do
            if peer_settled; then
              HALTED=true
              kill -TERM "$PID" 2>/dev/null || true
              sleep 1
              kill -KILL "$PID" 2>/dev/null || true
              wait "$PID" 2>/dev/null || true
              break
            fi
            sleep 3
          done

          if [ "$HALTED" = true ]; then
            echo 'phase2_status=HALTED_DURING_SEARCH_BY_VERIFIED_PEER' | tee -a results/summary.txt
            tail -n 80 results/phase2.log || true
            echo 'rc=halted' >> "$GITHUB_OUTPUT"
            echo 'halted=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          wait "$PID"
          RC=$?
          cat results/phase2.log
          echo "phase2_rc=${RC}" | tee -a results/summary.txt
          if [ "$RC" -ne 0 ] && [ "$RC" -ne 1 ]; then
            echo "PROTOCOL FAILURE phase2 rc=${RC}" >&2
            exit 2
          fi
          echo "rc=${RC}" >> "$GITHUB_OUTPUT"
          echo 'halted=false' >> "$GITHUB_OUTPUT"
          exit 0

      - name: Independently verify phase 2 certificate
        if: steps.phase2.outputs.rc == '0'
        id: verify2
        shell: bash
        env:
          AGENT: ${{ matrix.agent }}
        run: |
          set -euo pipefail
          test -s "results/${AGENT}_phase2_inverse.mm"
          python -u metamath.py verify "results/${AGENT}_phase2_inverse.mm" \
            --only chk --progress 0 \
            2>&1 | tee results/phase2_independent_verify.log
          grep -Eq '^  verified[[:space:]]+1$' results/phase2_independent_verify.log
          {
            echo "agent=${AGENT}"
            echo 'phase=2'
            echo 'independent_V=1'
            echo "run_id=${GITHUB_RUN_ID}"
            echo "commit=${GITHUB_SHA}"
          } > results/settlement.signal
          echo 'phase2_independent_V=1' | tee -a results/summary.txt
          echo 'revision_rescue=true' | tee -a results/summary.txt
          echo 'verified=true' >> "$GITHUB_OUTPUT"

      - name: Publish phase 2 verified-settlement signal
        if: steps.verify2.outputs.verified == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: p8-038-SETTLED-${{ matrix.agent }}-phase2-${{ github.run_id }}
          path: results/settlement.signal
          if-no-files-found: error
          retention-days: 90

      - name: Record unresolved revision result
        if: steps.phase2.outputs.rc == '1'
        shell: bash
        run: |
          echo 'revision_rescue=false' | tee -a results/summary.txt

      - name: Show result
        if: always()
        shell: bash
        run: |
          echo '--- summary ---'
          cat results/summary.txt 2>/dev/null || true
          echo '--- key outcomes ---'
          grep -hE 'OUTCOME:|candidate certificate|CV verdict|expansions' results/*.log 2>/dev/null | tail -n 120 || true

      - name: Upload per-agent record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p8-038-prcon-${{ matrix.agent }}-${{ github.run_id }}
          path: |
            results
            setmm_sha256.txt
          if-no-files-found: error
          retention-days: 90