name: Predator8 prcom quicksand revision A-B

on:
  workflow_dispatch:
    inputs:
      budget:
        description: Total expansion budget per arm
        required: true
        default: '30000'
      seed:
        description: Frozen random seed for both arms
        required: true
        default: '2301'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONPATH: ${{ github.workspace }}/predator 8/recovered8_002
      BUDGET: ${{ inputs.budget }}
      SEED: ${{ inputs.seed }}
    steps:
      - name: Check out selected ref
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ML runtime
        run: python -m pip install --quiet numpy scipy scikit-learn joblib

      - name: Reassemble and validate recovered 8.002 runtime
        shell: bash
        run: |
          set -euo pipefail
          cd 'predator 8/recovered8_002'
          cat runtime_chunks/part00.b64 runtime_chunks/part01.b64 runtime_chunks/part02.b64 \
              runtime_chunks/part03.b64 runtime_chunks/part04.b64 runtime_chunks/part05.b64 \
              runtime_chunks/part06.b64 runtime_chunks/part07.b64 runtime_chunks/part08.b64 \
              runtime_chunks/part09.b64 > /tmp/recovered8_002_runtime.b64
          test "$(wc -c < /tmp/recovered8_002_runtime.b64 | tr -d ' ')" = "167804"
          base64 -d /tmp/recovered8_002_runtime.b64 > /tmp/recovered8_002_runtime.zip
          test "$(sha256sum /tmp/recovered8_002_runtime.zip | awk '{print $1}')" = \
               "92b7fce75efb18a6a50b87729b4c286b14a9e89a94e4c7ffe054f3199252bac3"
          unzip -t /tmp/recovered8_002_runtime.zip
          unzip -o /tmp/recovered8_002_runtime.zip
          python -m py_compile \
            Predator_8.001_FROZEN.py predator8_ml_ranker.py predator8_external_cv.py \
            setmm_grammar.py metamath.py predator8_015_bidirectional_attention.py \
            predator8_016_prcom_exactify.py predator8_017_fullgraph_exactify.py \
            predator8_018_bailout.py predator8_019_selective_sink.py \
            predator8_033_bit_coupled_adaptive.py predator8_039_quicksand_revision.py \
            bounded_exactifier.py settlement_authority.py predator8_authority_adapter.py _loss.py

      - name: Unit-test quicksand revision invariants
        shell: bash
        run: |
          set -euo pipefail
          cd 'predator 8/recovered8_002'
          python -m unittest -v test_predator8_039_quicksand_revision.py \
            2>&1 | tee p8_039_unit_tests.log

      - name: Download exact historical set.mm
        shell: bash
        run: |
          set -euo pipefail
          cd 'predator 8/recovered8_002'
          curl -L --retry 3 --fail \
            -o set.mm \
            https://raw.githubusercontent.com/metamath/set.mm/cd577894d8e6bf8b4fe8014c0d525d531507e4b7/set.mm
          ENV_SHA=$(sha256sum set.mm | awk '{print $1}')
          MODEL_SHA=$(sha256sum prcom_quick_policy.joblib | awk '{print $1}')
          echo "environment_sha256=${ENV_SHA}" | tee recovered_hashes_8_039.txt
          echo "model_sha256=${MODEL_SHA}" | tee -a recovered_hashes_8_039.txt
          echo "budget=${BUDGET}" | tee -a recovered_hashes_8_039.txt
          echo "seed=${SEED}" | tee -a recovered_hashes_8_039.txt
          test "${ENV_SHA}" = "1016d7edb0508abde0fe240bb5243e588c5067f8cb10ee6e1cc5733fc05acdb5"
          test "${MODEL_SHA}" = "0531268d3f6b99038d001bfa64bbfebb304620ae7394dc61ca998377cf87884c"

      - name: Run theorem-authority integration tests
        shell: bash
        run: |
          set -euo pipefail
          cd 'predator 8/recovered8_002'
          python -m unittest -v \
            test_predator8_016_prcom_exactify.py \
            test_bounded_exactifier.py \
            test_settlement_authority.py \
            test_predator8_authority_adapter.py \
            2>&1 | tee p8_039_authority_tests.log

      - name: Run frozen baseline 8.019
        shell: bash
        run: |
          set +e
          set -uo pipefail
          cd 'predator 8/recovered8_002'
          python -u predator8_019_selective_sink.py set.mm \
            --engine Predator_8.001_FROZEN.py \
            --model prcom_quick_policy.joblib \
            --label prcom \
            --budget "${BUDGET}" \
            --brute-reserve 6000 \
            --max-depth 12 \
            --max-open 8 \
            --seed "${SEED}" \
            --creativity 0.55 \
            --opener-cap 48 \
            --progress 250 \
            --frontier-limit 120000 \
            --probe-depth 3 \
            --probe-cap 2000 \
            --probe-total-cap 4000 \
            --probe-next-layer 30000 \
            --out prcom_p8_019_baseline.mm \
            2>&1 | tee prcom_p8_019_baseline.log
          RC=${PIPESTATUS[0]}
          echo "baseline_rc=${RC}" | tee baseline_rc_8_039.txt
          if [ "$RC" -eq 2 ]; then exit 2; fi
          if [ "$RC" -ne 0 ] && [ "$RC" -ne 1 ]; then exit 2; fi
          exit 0

      - name: Independently verify baseline certificate if emitted
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd 'predator 8/recovered8_002'
          if [ -f prcom_p8_019_baseline.mm ]; then
            python -u predator8_external_cv.py set.mm \
              --target prcom --certificate prcom_p8_019_baseline.mm \
              | tee independent_cv_8_019_baseline.log
          else
            echo "No baseline certificate emitted." | tee independent_cv_8_019_baseline.log
          fi

      - name: Run treatment 8.039 joint revision
        if: always()
        shell: bash
        run: |
          set +e
          set -uo pipefail
          cd 'predator 8/recovered8_002'
          python -u predator8_039_quicksand_revision.py set.mm \
            --engine Predator_8.001_FROZEN.py \
            --model prcom_quick_policy.joblib \
            --label prcom \
            --budget "${BUDGET}" \
            --brute-reserve 6000 \
            --max-depth 12 \
            --max-open 8 \
            --seed "${SEED}" \
            --creativity 0.55 \
            --opener-cap 48 \
            --progress 250 \
            --frontier-limit 120000 \
            --probe-depth 3 \
            --probe-cap 2000 \
            --probe-total-cap 4000 \
            --probe-next-layer 30000 \
            --out prcom_p8_039_treatment.mm \
            2>&1 | tee prcom_p8_039_treatment.log
          RC=${PIPESTATUS[0]}
          echo "treatment_rc=${RC}" | tee treatment_rc_8_039.txt
          if [ "$RC" -eq 2 ]; then exit 2; fi
          if [ "$RC" -ne 0 ] && [ "$RC" -ne 1 ]; then exit 2; fi
          exit 0

      - name: Independently verify treatment certificate if emitted
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd 'predator 8/recovered8_002'
          if [ -f prcom_p8_039_treatment.mm ]; then
            python -u predator8_external_cv.py set.mm \
              --target prcom --certificate prcom_p8_039_treatment.mm \
              | tee independent_cv_8_039_treatment.log
          else
            echo "No treatment certificate emitted." | tee independent_cv_8_039_treatment.log
          fi

      - name: Build A-B comparison summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd 'predator 8/recovered8_002'
          python - <<'PY'
          import json, re
          from pathlib import Path

          def arm(name, log_name, cv_name):
              text = Path(log_name).read_text(encoding='utf-8', errors='replace') if Path(log_name).exists() else ''
              cv = Path(cv_name).read_text(encoding='utf-8', errors='replace') if Path(cv_name).exists() else ''
              m = list(re.finditer(r'candidate found after total\s+(\d+)\s+expansions', text))
              guided = list(re.finditer(r'best_h=([0-9.]+)', text))
              return {
                  'arm': name,
                  'verified_proof_reported': 'OUTCOME: VERIFIED PROOF' in text,
                  'independent_cv_ok': 'EXTERNAL CV: OK' in cv,
                  'first_candidate_expansions': int(m[0].group(1)) if m else None,
                  'last_best_h': float(guided[-1].group(1)) if guided else None,
                  'revision_events': text.count('[REVISION]'),
                  'revision_end_events': text.count('[REVISION-END]'),
                  'joint_bailouts': text.count('[JOINT-BAILOUT]'),
                  'baseline_bailouts': text.count('[BAILOUT]'),
                  'false_zeros': text.count('[FALSE-ZERO]'),
              }

          summary = {
              'budget': int(__import__('os').environ['BUDGET']),
              'seed': int(__import__('os').environ['SEED']),
              'baseline': arm('8.019', 'prcom_p8_019_baseline.log', 'independent_cv_8_019_baseline.log'),
              'treatment': arm('8.039', 'prcom_p8_039_treatment.log', 'independent_cv_8_039_treatment.log'),
              'interpretation_guard': 'No certificate => no settlement within budget; heuristic progress alone is not theoremhood.',
          }
          Path('quicksand_comparison.json').write_text(json.dumps(summary, indent=2), encoding='utf-8')
          print(json.dumps(summary, indent=2))
          PY

      - name: Summarize scientific telemetry
        if: always()
        shell: bash
        run: |
          cd 'predator 8/recovered8_002'
          echo '=== BASELINE 8.019 ==='
          grep -E 'H-IMPROVE|BAILOUT|SURGE|TORPOR|EXACTIFY|OUTCOME|candidate found' \
            prcom_p8_019_baseline.log 2>/dev/null || true
          echo '=== TREATMENT 8.039 ==='
          grep -E 'H-IMPROVE|L-IMPROVE|REVISION|JOINT-BAILOUT|QUICKSAND|SURGE|TORPOR|EXACTIFY|OUTCOME|candidate found' \
            prcom_p8_039_treatment.log 2>/dev/null || true
          echo '=== COMPARISON ==='
          cat quicksand_comparison.json 2>/dev/null || true

      - name: Upload experiment record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: predator8-prcom-quicksand-revision-${{ github.run_id }}
          path: |
            predator 8/recovered8_002/recovered_hashes_8_039.txt
            predator 8/recovered8_002/p8_039_unit_tests.log
            predator 8/recovered8_002/p8_039_authority_tests.log
            predator 8/recovered8_002/prcom_p8_019_baseline.log
            predator 8/recovered8_002/prcom_p8_039_treatment.log
            predator 8/recovered8_002/baseline_rc_8_039.txt
            predator 8/recovered8_002/treatment_rc_8_039.txt
            predator 8/recovered8_002/independent_cv_8_019_baseline.log
            predator 8/recovered8_002/independent_cv_8_039_treatment.log
            predator 8/recovered8_002/quicksand_comparison.json
            predator 8/recovered8_002/prcom_p8_019_baseline.mm
            predator 8/recovered8_002/prcom_p8_039_treatment.mm
          if-no-files-found: ignore
