name: Predator8 8.019 transfer on sgrpcl

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sgrpcl-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}/predator 8/recovered8_002
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ML runtime
        run: python -m pip install --quiet numpy scipy scikit-learn joblib

      - name: Reassemble and validate recovered 8.002 runtime
        shell: bash
        run: |
          set -euo pipefail
          cd 'predator 8/recovered8_002'
          cat runtime_chunks/part00.b64 runtime_chunks/part01.b64 runtime_chunks/part02.b64 \
              runtime_chunks/part03.b64 runtime_chunks/part04.b64 runtime_chunks/part05.b64 \
              runtime_chunks/part06.b64 runtime_chunks/part07.b64 runtime_chunks/part08.b64 \
              runtime_chunks/part09.b64 > /tmp/recovered8_002_runtime.b64
          test "$(wc -c < /tmp/recovered8_002_runtime.b64 | tr -d ' ')" = "167804"
          base64 -d /tmp/recovered8_002_runtime.b64 > /tmp/recovered8_002_runtime.zip
          test "$(sha256sum /tmp/recovered8_002_runtime.zip | awk '{print $1}')" = \
               "92b7fce75efb18a6a50b87729b4c286b14a9e89a94e4c7ffe054f3199252bac3"
          unzip -t /tmp/recovered8_002_runtime.zip
          unzip -o /tmp/recovered8_002_runtime.zip
          python -m py_compile \
            Predator_8.001_FROZEN.py predator8_ml_ranker.py predator8_external_cv.py \
            setmm_grammar.py metamath.py predator8_015_bidirectional_attention.py \
            predator8_016_prcom_exactify.py predator8_017_fullgraph_exactify.py \
            predator8_018_bailout.py predator8_019_selective_sink.py \
            predator8_019_transfer.py bounded_exactifier.py settlement_authority.py \
            predator8_authority_adapter.py _loss.py

      - name: Download exact historical set.mm
        shell: bash
        run: |
          set -euo pipefail
          cd 'predator 8/recovered8_002'
          curl -L --retry 3 --fail \
            -o set.mm \
            https://raw.githubusercontent.com/metamath/set.mm/cd577894d8e6bf8b4fe8014c0d525d531507e4b7/set.mm
          ENV_SHA=$(sha256sum set.mm | awk '{print $1}')
          MODEL_SHA=$(sha256sum prcom_quick_policy.joblib | awk '{print $1}')
          echo "environment_sha256=${ENV_SHA}" | tee recovered_hashes_8_019_sgrpcl.txt
          echo "model_sha256=${MODEL_SHA}" | tee -a recovered_hashes_8_019_sgrpcl.txt
          test "${ENV_SHA}" = "1016d7edb0508abde0fe240bb5243e588c5067f8cb10ee6e1cc5733fc05acdb5"
          test "${MODEL_SHA}" = "0531268d3f6b99038d001bfa64bbfebb304620ae7394dc61ca998377cf87884c"

      - name: Run theorem-authority integration tests
        shell: bash
        run: |
          set -euo pipefail
          cd 'predator 8/recovered8_002'
          python -m unittest -v \
            test_predator8_016_prcom_exactify.py \
            test_bounded_exactifier.py \
            test_settlement_authority.py \
            test_predator8_authority_adapter.py \
            2>&1 | tee p8_019_sgrpcl_authority_tests.log

      - name: Run 30000-expansion 8.019 transfer controller on sgrpcl
        shell: bash
        run: |
          set +e
          set -uo pipefail
          cd 'predator 8/recovered8_002'
          python -u predator8_019_transfer.py set.mm \
            --engine Predator_8.001_FROZEN.py \
            --model prcom_quick_policy.joblib \
            --label sgrpcl \
            --budget 30000 \
            --brute-reserve 6000 \
            --max-depth 12 \
            --max-open 8 \
            --seed 2301 \
            --creativity 0.55 \
            --opener-cap 48 \
            --progress 250 \
            --frontier-limit 120000 \
            --probe-depth 3 \
            --probe-cap 2000 \
            --probe-total-cap 4000 \
            --probe-next-layer 30000 \
            --out sgrpcl_p8_019_transfer.mm \
            2>&1 | tee sgrpcl_p8_019_transfer.log
          RC=${PIPESTATUS[0]}
          echo "controller_rc=${RC}" | tee controller_rc_8_019_sgrpcl.txt
          if [ "$RC" -eq 2 ]; then
            echo "PROTOCOL FAILURE" >&2
            exit 2
          fi
          if [ "$RC" -ne 0 ] && [ "$RC" -ne 1 ]; then
            echo "unexpected controller rc=$RC" >&2
            exit 2
          fi
          exit 0

      - name: Independent certificate check if emitted
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd 'predator 8/recovered8_002'
          if [ -f sgrpcl_p8_019_transfer.mm ]; then
            python -u predator8_external_cv.py set.mm \
              --target sgrpcl --certificate sgrpcl_p8_019_transfer.mm | tee independent_cv_8_019_sgrpcl.log
          else
            echo "No certificate emitted." | tee independent_cv_8_019_sgrpcl.log
          fi

      - name: Summarize transfer telemetry
        if: always()
        shell: bash
        run: |
          cd 'predator 8/recovered8_002'
          grep -E 'TRANSFER ATTESTATION|H-IMPROVE|SATURATE|INFO-GAIN|PROXIMITY-ALARM|EXACTIFY|FALSE-PROXIMITY|BAILOUT|SURGE|TORPOR|BRUTE|MEMORY-GUARD|CONTROL SUMMARY|OUTCOME|candidate found' \
            sgrpcl_p8_019_transfer.log 2>/dev/null || true
          echo '--- independent CV ---'
          cat independent_cv_8_019_sgrpcl.log 2>/dev/null || true

      - name: Upload experiment record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: predator8-sgrpcl-transfer-${{ github.run_id }}
          path: |
            predator 8/recovered8_002/recovered_hashes_8_019_sgrpcl.txt
            predator 8/recovered8_002/p8_019_sgrpcl_authority_tests.log
            predator 8/recovered8_002/sgrpcl_p8_019_transfer.log
            predator 8/recovered8_002/controller_rc_8_019_sgrpcl.txt
            predator 8/recovered8_002/independent_cv_8_019_sgrpcl.log
            predator 8/recovered8_002/sgrpcl_p8_019_transfer.mm
          if-no-files-found: ignore
