name: Partner8 prcom comparison

on:
  push:
    branches: [main]
    paths:
      - predator 8/predator 8.010-partner-pair.py
      - .github/workflows/partner8-prcom-comparison.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prcom-partner-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download frozen set.mm
        run: |
          curl -L --retry 3 --fail \
            -o set.mm \
            https://raw.githubusercontent.com/metamath/set.mm/0acf270b982d31fa1cd34f075116e7784869a480/set.mm
          sha256sum set.mm | tee partner8_setmm_sha256.txt

      - name: Compile and selftest engines
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile "predator 8/predator 8.001.py"
          python -m py_compile "predator 8/predator 8.010-partner-pair.py"
          python -u "predator 8/predator 8.001.py" selftest | tee partner8_base_selftest.log

      - name: Run equal-budget prcom comparison
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p partner8_prcom_results
          BUDGET=12000
          COMMON="--label prcom --budget ${BUDGET} --max-depth 12 --max-open 8 --opener-cap 64 --creativity 0.55 --seed 2301 --progress 500"

          echo "=== CONDITION A: single P, global cap ${BUDGET} ===" | tee partner8_prcom_results/single.log
          python -u "predator 8/predator 8.001.py" prove set.mm $COMMON \
            --agents 1 --out partner8_prcom_results/prcom_single.mm \
            2>&1 | tee -a partner8_prcom_results/single.log
          RC_SINGLE=${PIPESTATUS[0]}

          echo "=== CONDITION B: two P, no direct partner channel, same global cap ${BUDGET} ===" | tee partner8_prcom_results/noncommunicating.log
          python -u "predator 8/predator 8.001.py" prove set.mm $COMMON \
            --agents 2 --out partner8_prcom_results/prcom_noncommunicating.mm \
            2>&1 | tee -a partner8_prcom_results/noncommunicating.log
          RC_NONCOMM=${PIPESTATUS[0]}

          echo "=== CONDITION C: communicating P1^(1,3)+P2^(2,4), same global cap ${BUDGET} ===" | tee partner8_prcom_results/communicating.log
          PREDATOR_PARTNER_REPORT=250 \
          python -u "predator 8/predator 8.010-partner-pair.py" prove set.mm $COMMON \
            --agents 2 --out partner8_prcom_results/prcom_communicating.mm \
            2>&1 | tee -a partner8_prcom_results/communicating.log
          RC_COMM=${PIPESTATUS[0]}

          {
            echo "target=prcom"
            echo "frozen_setmm=0acf270b982d31fa1cd34f075116e7784869a480"
            echo "global_expansion_cap_each=${BUDGET}"
            echo "single_rc=${RC_SINGLE}"
            echo "noncommunicating_rc=${RC_NONCOMM}"
            echo "communicating_rc=${RC_COMM}"
          } | tee partner8_prcom_results/summary.txt

          # Protocol failure is different from finite-resource UNKNOWN and must
          # fail the experiment. UNKNOWN (rc=1) is a legitimate measurement.
          if [ "${RC_SINGLE}" -eq 2 ] || [ "${RC_NONCOMM}" -eq 2 ] || [ "${RC_COMM}" -eq 2 ]; then
            echo "PROTOCOL FAILURE detected" >&2
            exit 2
          fi
          exit 0

      - name: Independently verify any emitted certificates
        shell: bash
        run: |
          set -euo pipefail
          for f in partner8_prcom_results/*.mm; do
            [ -e "$f" ] || continue
            echo "VERIFYING $f"
            python metamath.py verify "$f" | tee -a partner8_prcom_results/independent_verifier.log
          done

      - name: Summarize key measurements
        if: always()
        shell: bash
        run: |
          echo "--- summary.txt ---"
          cat partner8_prcom_results/summary.txt 2>/dev/null || true
          echo "--- outcomes / certificates / telemetry ---"
          grep -hE "OUTCOME:|candidate certificate|partner telemetry|partner expansion accounting|STATE|surge" \
            partner8_prcom_results/*.log 2>/dev/null | tail -n 100 || true

      - name: Upload comparison record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partner8-prcom-${{ github.run_id }}
          path: |
            partner8_prcom_results
            partner8_base_selftest.log
            partner8_setmm_sha256.txt
