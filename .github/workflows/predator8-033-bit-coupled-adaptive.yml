name: Predator8 8.033 bit-primary coupled adaptive

on:
  push:
    branches: [predator8-033-bit-coupled-adaptive]
    paths:
      - '.github/workflows/predator8-033-bit-coupled-adaptive.yml'
      - 'predator 8/recovered8_002/predator8_033_bit_coupled_adaptive.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: predator8-033-bit-coupled-adaptive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  train-and-blind-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}/predator 8/recovered8_002

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned ML runtime
        run: python -m pip install --quiet numpy scipy scikit-learn==1.8.0 joblib

      - name: Reassemble frozen Predator runtime
        shell: bash
        run: |
          set -euo pipefail
          cd 'predator 8/recovered8_002'
          cat runtime_chunks/part00.b64 runtime_chunks/part01.b64 runtime_chunks/part02.b64 \
              runtime_chunks/part03.b64 runtime_chunks/part04.b64 runtime_chunks/part05.b64 \
              runtime_chunks/part06.b64 runtime_chunks/part07.b64 runtime_chunks/part08.b64 \
              runtime_chunks/part09.b64 > /tmp/recovered8_002_runtime.b64
          test "$(wc -c < /tmp/recovered8_002_runtime.b64 | tr -d ' ')" = "167804"
          base64 -d /tmp/recovered8_002_runtime.b64 > /tmp/recovered8_002_runtime.zip
          test "$(sha256sum /tmp/recovered8_002_runtime.zip | awk '{print $1}')" = \
               "92b7fce75efb18a6a50b87729b4c286b14a9e89a94e4c7ffe054f3199252bac3"
          unzip -q -o /tmp/recovered8_002_runtime.zip
          python -m py_compile \
            Predator_8.001_FROZEN.py bounded_exactifier.py prcom_root_exactify.py \
            predator8_031_generalized_training.py predator8_033_bit_coupled_adaptive.py

      - name: Download frozen historical set.mm
        shell: bash
        run: |
          set -euo pipefail
          cd 'predator 8/recovered8_002'
          curl -L --retry 3 --fail -o set.mm \
            https://raw.githubusercontent.com/metamath/set.mm/cd577894d8e6bf8b4fe8014c0d525d531507e4b7/set.mm
          test "$(sha256sum set.mm | awk '{print $1}')" = \
               "1016d7edb0508abde0fe240bb5243e588c5067f8cb10ee6e1cc5733fc05acdb5"

      - name: Train 28 coupled parameters and blind-test prcom
        shell: bash
        run: |
          set -euo pipefail
          cd 'predator 8/recovered8_002'
          /usr/bin/time -f 'wall_seconds=%e\nuser_seconds=%U\nsys_seconds=%S\nmax_rss_kb=%M' \
            -o p8_033.time \
          python -u predator8_033_bit_coupled_adaptive.py set.mm \
            --engine Predator_8.001_FROZEN.py \
            --holdout prcom \
            --holdout-gap 32 \
            --train-theorems 36 \
            --eval-theorems 3 \
            --eval-budget 250 \
            --prcom-budget 3500 \
            --prcom-seeds 2301,2302,2303 \
            --seed 2301 \
            --out p8_033_bit_model.json \
            --report p8_033_bit_report.json \
            --csv p8_033_training.csv \
            2>&1 | tee p8_033.log

      - name: Summarize bit-primary result
        if: always()
        shell: bash
        run: |
          cd 'predator 8/recovered8_002'
          {
            echo 'Predator 8.033 — bit-primary coupled adaptive ATP'
            echo 'Hard constraint: V(P)=1'
            echo 'Protected objective: minimum FirstOccurrenceGammaV1 compressed certificate bits'
            echo 'Training: 28 fitted coupled parameters; prcom held out completely until blind test.'
            cat p8_033.time 2>/dev/null || true
            grep -E '^\[(GUARD|EVAL-PROBE|EVAL|TRAIN|TRAIN-DATA|PAIRS|BASELINE|MODEL|DEPLOY|BLIND-BEGIN|PRCOM-BASELINE|PRCOM-LEARNED|PRCOM-KEY|DONE|WEIGHTS)\]' \
              p8_033.log 2>/dev/null || true
          } | tee p8_033.summary

      - name: Upload experiment record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: predator8-033-bit-coupled-adaptive-${{ github.run_id }}
          path: |
            predator 8/recovered8_002/p8_033_bit_model.json
            predator 8/recovered8_002/p8_033_bit_report.json
            predator 8/recovered8_002/p8_033_training.csv
            predator 8/recovered8_002/p8_033.log
            predator 8/recovered8_002/p8_033.summary
            predator 8/recovered8_002/p8_033.time
          if-no-files-found: ignore
          retention-days: 90
