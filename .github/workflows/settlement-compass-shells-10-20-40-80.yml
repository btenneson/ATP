name: Settlement Compass Shells 10 20 40 80

on:
  push:
    paths:
      - 'optimizations/settlement_compass/src/compass_navigation_shells_10_20_40_80.py'
      - '.github/workflows/settlement-compass-shells-10-20-40-80.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shells:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip scikit-learn scipy numpy
      - name: Fetch frozen set.mm snapshot
        run: |
          curl -fsSL https://raw.githubusercontent.com/metamath/set.mm/develop/set.mm -o /tmp/set.mm
          test "$(sha256sum /tmp/set.mm | awk '{print $1}')" = "7b70cd8cca88aeb72a8dd97029d0b506015fb0325afec581cdc9add8ca0c8547"
      - name: Run nested training shells on same 20 targets
        env:
          SETMM_PATH: /tmp/set.mm
          COMPASS_RESULTS_JSON: optimizations/settlement_compass/results/experiment_003_shells_10_20_40_80.json
          COMPASS_RESULTS_CSV: optimizations/settlement_compass/results/experiment_003_shells_10_20_40_80_rows.csv
        run: |
          mkdir -p optimizations/settlement_compass/results
          python optimizations/settlement_compass/src/compass_navigation_shells_10_20_40_80.py
      - name: Commit results
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add optimizations/settlement_compass/results/experiment_003_shells_10_20_40_80.json \
                  optimizations/settlement_compass/results/experiment_003_shells_10_20_40_80_rows.csv
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'record settlement compass 10-20-40-80 shell experiment'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
